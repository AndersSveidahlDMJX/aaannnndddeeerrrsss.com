<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200" />
  <title>OG Preview — Screenshot this</title>
  <style>
    .home-fly {
      position: fixed;
      top: 26px;
      right: 10px;
      left: auto;
      z-index: 2147483647;
      display: block;
      width: 30px;
      height: 30px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      line-height: 0;
      overflow: visible;
      opacity: 0.9;
      pointer-events: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .home-fly:hover {
      opacity: 1;
      transform: scale(1.04);
    }
    .home-fly img {
      width: 30px;
      height: 30px;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }
@font-face {
      font-family: 'EurostileExtBlk';
      src: url('fonts/Eurostile-BoldExtendedTwo.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #000;
    }

    .glow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 1300px;
      height: 630px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.55;
      mix-blend-mode: screen;
      background:
        radial-gradient(ellipse 28% 52% at 50% 0%, rgba(255,255,255,0.52) 0%, rgba(255,255,250,0.18) 60%, transparent 100%),
        radial-gradient(ellipse 58% 80% at 50% 0%, rgba(255,255,252,0.26) 0%, rgba(255,255,248,0.09) 65%, transparent 100%),
        radial-gradient(ellipse 92% 100% at 50% 0%, rgba(255,255,252,0.11) 0%, transparent 80%);
    }

    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .line {
      font-family: 'EurostileExtBlk', sans-serif;
      font-weight: normal;
      font-style: normal;
      letter-spacing: 0.08em;
      white-space: nowrap;
      -webkit-font-smoothing: antialiased;
      background: linear-gradient(
        180deg,
        #ffffff 0%,
        #e8e8e8 20%,
        #b0b0b0 55%,
        #7a7a7a 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      color: transparent;
      line-height: 0.92;
      position: relative;
      z-index: 2;
      text-shadow: 0 -1px 8px rgba(255,255,255,0.55), 0 2px 8px rgba(0,0,0,0.35);
    }

    #anders   { font-size: 200px; }
    #sveidahl { font-size: 200px; }

    .home-fly {
      position: fixed;
      top: 26px;
      left: auto;
      right: 10px;
      z-index: 2147483647;
      display: block;
      width: 30px;
      height: 30px;
      padding: 0;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      text-decoration: none;
      line-height: 0;
      overflow: visible;
      opacity: 0.9;
      pointer-events: auto;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }
    .home-fly:hover {
      opacity: 1;
      transform: scale(1.04);
    }
    .home-fly img {
      width: 30px;
      height: 30px;
      display: block;
      object-fit: contain;
      pointer-events: none;
    }

</style>
  <style>
    .back{display:none!important}
  </style>
</head>
<body>
<a class="home-fly" href="index.html" aria-label="Go to home" style="position:fixed;top:16px;left:16px;right:auto;z-index:10;width:40px;height:40px;display:block;padding:0;margin:0;border:0;border-radius:0;background:transparent;box-shadow:none;line-height:0;overflow:visible;opacity:0.9;text-decoration:none;pointer-events:auto;"><img src="images/fly emoji.webp" alt="Fly home" style="display:block;width:40px;height:40px;object-fit:contain;pointer-events:none;" /></a>

  <div class="stage">
    <div class="glow"></div>
    <div class="line" id="anders">Anders</div>
    <div class="line" id="sveidahl">Sveidahl</div>
  </div>

  <script>
    window.addEventListener('load', function () {
      var a = document.getElementById('anders');
      var s = document.getElementById('sveidahl');
      var targetWidth = a.getBoundingClientRect().width;
      var currentSize = parseFloat(getComputedStyle(s).fontSize);
      var currentWidth = s.getBoundingClientRect().width;
      var newSize = currentSize * (targetWidth / currentWidth);
      s.style.fontSize = newSize + 'px';
    });
  </script>
</body>
</html>
