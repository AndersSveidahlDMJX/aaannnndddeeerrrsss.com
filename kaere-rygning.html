  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
    }

    .back {
      position: fixed;
      top: 28px;
      left: 32px;
      text-decoration: none;
      color: #ff0000;
      font-family: 'Share Tech Mono', monospace;
      font-size: 1rem;
      letter-spacing: 0.1em;
      opacity: 0.7;
      z-index: 200;
      transition: opacity 0.2s, text-shadow 0.2s;
    }
    .back:hover { opacity: 1; text-shadow: 0 0 10px rgba(255,0,0,0.8); }
    .back::before { content: '\2190 '; }

    .countdown-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      z-index: 10;
    }

    .segments-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .seg-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .seg-display-outer {
      position: relative;
      display: inline-block;
    }

    .seg-ghost {
      font-family: 'DSEG7 Classic', monospace;
      font-size: clamp(3rem, 12vw, 8rem);
      color: rgba(255, 0, 0, 0.12);
      letter-spacing: 0.04em;
      position: absolute;
      inset: 0;
      pointer-events: none;
      user-select: none;
    }

    .seg-val {
      font-family: 'DSEG7 Classic', monospace;
      font-size: clamp(3rem, 12vw, 8rem);
      color: #ff0000;
      text-shadow:
        0 0 8px rgba(255, 0, 0, 0.9),
        0 0 24px rgba(255, 0, 0, 0.5),
        0 0 48px rgba(255, 0, 0, 0.2);
      letter-spacing: 0.04em;
      position: relative;
    }

    .seg-label {
      font-family: 'Share Tech Mono', monospace;
      color: #ff0000;
      font-size: clamp(0.5rem, 1.6vw, 0.7rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      opacity: 0.55;
    }

    .seg-colon {
      font-family: 'DSEG7 Classic', monospace;
      font-size: clamp(3rem, 12vw, 8rem);
      color: #ff0000;
      text-shadow: 0 0 8px rgba(255, 0, 0, 0.9);
      padding: 0 4px;
      align-self: flex-start;
      padding-top: 0;
      line-height: 1;
      opacity: 0.6;
    }

    .main-label {
      font-family: 'DSEG14 Classic', monospace;
      color: #ff0000;
      font-size: clamp(1.1rem, 3.5vw, 2rem);
      letter-spacing: 0.1em;
      text-shadow:
        0 0 8px rgba(255, 0, 0, 0.9),
        0 0 20px rgba(255, 0, 0, 0.4);
      opacity: 0.9;
    }

    #nav-shortcuts { display: none !important; }

    @media (max-width: 600px) {
      .back { display: none !important; }
      .seg-colon { padding: 0 1px; }
    }
  </style>
</head>
<body>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap">Kære Rygning</h1>

  <a class="back" href="other-stuff.html">BACK</a>

  <div class="countdown-wrap">
    <div class="segments-row">
      <!-- Days -->
      <div class="seg-unit">
        <div class="seg-display-outer">
          <div class="seg-ghost" id="ghost-d">88</div>
          <div class="seg-val" id="val-d">--</div>
        </div>
      </div>
      <div class="seg-colon">:</div>
      <!-- Hours -->
      <div class="seg-unit">
        <div class="seg-display-outer">
          <div class="seg-ghost" id="ghost-h">88</div>
          <div class="seg-val" id="val-h">--</div>
        </div>
      </div>
      <div class="seg-colon">:</div>
      <!-- Minutes -->
      <div class="seg-unit">
        <div class="seg-display-outer">
          <div class="seg-ghost" id="ghost-m">88</div>
          <div class="seg-val" id="val-m">--</div>
        </div>
      </div>
      <div class="seg-colon">:</div>
      <!-- Seconds -->
      <div class="seg-unit">
        <div class="seg-display-outer">
          <div class="seg-ghost" id="ghost-s">88</div>
          <div class="seg-val" id="val-s">--</div>
        </div>
      </div>
    </div>
    <div class="main-label">Dage til rygestop</div>
  </div>

  <script>
    function pad(n) { return String(n).padStart(2, '0'); }
    function updateCountdown() {
      var target = new Date('2026-06-26T00:00:00');
      var now = new Date();
      var diff = Math.max(0, target - now);
      var totalSecs = Math.floor(diff / 1000);
      var s = totalSecs % 60;
      var totalMins = Math.floor(totalSecs / 60);
      var m = totalMins % 60;
      var totalHours = Math.floor(totalMins / 60);
      var h = totalHours % 24;
      var d = Math.floor(totalHours / 24);
      var dStr = String(d);
      document.getElementById('val-d').textContent = dStr;
      document.getElementById('ghost-d').textContent = '8'.repeat(Math.max(dStr.length, 2));
      document.getElementById('val-h').textContent = pad(h);
      document.getElementById('val-m').textContent = pad(m);
      document.getElementById('val-s').textContent = pad(s);
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
